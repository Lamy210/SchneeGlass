name: Production Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact X.Y.Z version to sign and notarize.'
        required: true
        type: string
      confirm_sign_and_notarize:
        description: 'Run the protected Developer ID signing and Apple notarization job.'
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/production-release.yml'
      - 'Scripts/build-notarized-release.sh'
      - 'Scripts/record-release-bundle-metadata.sh'
      - 'Scripts/verify-release-metadata.sh'
      - 'Scripts/verify-release-credential-inputs.sh'
      - 'Scripts/verify-release-decoded-credentials.sh'
      - 'Scripts/verify-release-evidence.sh'
      - 'Scripts/verify-production-release-preflight.sh'
      - 'docs/RELEASE_CREDENTIALS.md'

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Production Release / Credential-free Preflight
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Production release path coverage
        run: |
          sed -n '/^  pull_request:/,/^permissions:/p' .github/workflows/production-release.yml \
            | grep -Fq "      - 'Scripts/verify-release-metadata.sh'" || {
              echo 'Production Release Candidate pull_request.paths is missing release validator: Scripts/verify-release-metadata.sh' >&2
              exit 1
            }

      - name: Shell syntax
        run: |
          bash -n Scripts/verify-release-metadata.sh
          bash -n Scripts/verify-production-release-preflight.sh
          bash -n Scripts/verify-release-credential-inputs.sh
          bash -n Scripts/verify-release-decoded-credentials.sh
          bash -n Scripts/build-notarized-release.sh
          bash -n Scripts/record-release-bundle-metadata.sh
          bash -n Scripts/verify-release-evidence.sh

      - name: Production release baseline
        run: bash Scripts/verify-production-release-preflight.sh

      - name: Credential input contract fixture
        env:
          RELEASE_VERSION: '0.1.0'
          DEVELOPER_ID_P12_BASE64: 'QQ=='
          DEVELOPER_ID_P12_PASSWORD: 'fixture-password'
          APPLE_TEAM_ID: 'ABCDE12345'
          APPSTORE_CONNECT_KEY_ID: 'FGHIJ67890'
          APPSTORE_CONNECT_ISSUER_ID: '12345678-1234-1234-1234-1234567890ab'
          APPSTORE_CONNECT_PRIVATE_KEY_BASE64: 'Qg=='
        run: |
          bash Scripts/verify-release-credential-inputs.sh

          FAILURES=0
          expect_rejected() {
            local label="$1"
            shift
            if "$@"; then
              echo "Credential validator unexpectedly accepted: $label" >&2
              FAILURES=$((FAILURES + 1))
            fi
          }

          expect_rejected 'release version with v prefix' \
            env RELEASE_VERSION='v0.1.0' bash Scripts/verify-release-credential-inputs.sh
          expect_rejected 'short Apple Team ID' \
            env APPLE_TEAM_ID='ABCDE1234' bash Scripts/verify-release-credential-inputs.sh
          expect_rejected 'short App Store Connect key ID' \
            env APPSTORE_CONNECT_KEY_ID='FGHIJ6789' bash Scripts/verify-release-credential-inputs.sh
          expect_rejected 'non-UUID App Store Connect issuer ID' \
            env APPSTORE_CONNECT_ISSUER_ID='not-a-uuid' bash Scripts/verify-release-credential-inputs.sh
          expect_rejected 'malformed Developer ID P12 base64' \
            env DEVELOPER_ID_P12_BASE64='@@not-base64@@' bash Scripts/verify-release-credential-inputs.sh
          expect_rejected 'malformed App Store Connect private key base64' \
            env APPSTORE_CONNECT_PRIVATE_KEY_BASE64='@@not-base64@@' bash Scripts/verify-release-credential-inputs.sh

          if [[ "$FAILURES" -ne 0 ]]; then
            echo "$FAILURES invalid credential contract case(s) were accepted" >&2
            exit 1
          fi

      - name: Build validates credential contract before side effects
        env:
          RELEASE_VERSION: '0.1.0'
          DEVELOPER_ID_P12_BASE64: 'QQ=='
          DEVELOPER_ID_P12_PASSWORD: 'fixture-password'
          APPLE_TEAM_ID: 'ABCDE12345'
          APPSTORE_CONNECT_KEY_ID: 'FGHIJ67890'
          APPSTORE_CONNECT_ISSUER_ID: '12345678-1234-1234-1234-1234567890ab'
          APPSTORE_CONNECT_PRIVATE_KEY_BASE64: 'Qg=='
        run: |
          rm -rf release-output
          LOG="$RUNNER_TEMP/credential-contract-build-integration.log"

          set +e
          APPLE_TEAM_ID='BAD' bash Scripts/build-notarized-release.sh >"$LOG" 2>&1
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 0 ]]; then
            cat "$LOG"
            echo 'Production release unexpectedly accepted malformed credential metadata.' >&2
            exit 1
          fi

          grep -F 'Release credential input verification failed: APPLE_TEAM_ID must be a 10-character ASCII alphanumeric Team ID' "$LOG" >/dev/null
          test ! -e release-output
          rm -f "$LOG"

      - name: Decoded credential contract fixture
        run: |
          FIXTURE="$RUNNER_TEMP/decoded-credential-fixture"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"

          openssl genpkey \
            -algorithm EC \
            -pkeyopt ec_paramgen_curve:P-256 \
            -out "$FIXTURE/signing.key"
          openssl req \
            -x509 \
            -new \
            -key "$FIXTURE/signing.key" \
            -out "$FIXTURE/signing.crt" \
            -subj '/CN=SchneeGlass CI Fixture' \
            -days 1
          openssl pkcs12 \
            -export \
            -out "$FIXTURE/DeveloperID.p12" \
            -inkey "$FIXTURE/signing.key" \
            -in "$FIXTURE/signing.crt" \
            -passout pass:fixture-password
          openssl genpkey \
            -algorithm EC \
            -pkeyopt ec_paramgen_curve:P-256 \
            -out "$FIXTURE/AuthKey.p8"

          printf '%s\n' 'not a PKCS#12 payload' > "$FIXTURE/not-p12.bin"
          printf '%s\n' 'not a private key' > "$FIXTURE/not-private-key.pem"

          bash Scripts/verify-release-decoded-credentials.sh \
            "$FIXTURE/DeveloperID.p12" \
            'fixture-password' \
            "$FIXTURE/AuthKey.p8"

          FAILURES=0
          expect_rejected() {
            local label="$1"
            shift
            if "$@" >/dev/null 2>&1; then
              echo "Decoded credential validator unexpectedly accepted: $label" >&2
              FAILURES=$((FAILURES + 1))
            fi
          }

          expect_rejected 'wrong PKCS#12 password' \
            bash Scripts/verify-release-decoded-credentials.sh \
              "$FIXTURE/DeveloperID.p12" \
              'wrong-password' \
              "$FIXTURE/AuthKey.p8"
          expect_rejected 'non-PKCS#12 payload' \
            bash Scripts/verify-release-decoded-credentials.sh \
              "$FIXTURE/not-p12.bin" \
              'fixture-password' \
              "$FIXTURE/AuthKey.p8"
          expect_rejected 'non-private-key payload' \
            bash Scripts/verify-release-decoded-credentials.sh \
              "$FIXTURE/DeveloperID.p12" \
              'fixture-password' \
              "$FIXTURE/not-private-key.pem"

          if [[ "$FAILURES" -ne 0 ]]; then
            echo "$FAILURES malformed decoded credential case(s) were accepted" >&2
            exit 1
          fi

      - name: Build validates decoded credentials before release side effects
        run: |
          FIXTURE="$RUNNER_TEMP/decoded-credential-fixture"
          rm -rf release-output
          LOG="$RUNNER_TEMP/decoded-credential-build-integration.log"

          export RELEASE_VERSION='0.1.0'
          export DEVELOPER_ID_P12_BASE64="$(/usr/bin/base64 < "$FIXTURE/not-p12.bin" | tr -d '\n')"
          export DEVELOPER_ID_P12_PASSWORD='fixture-password'
          export APPLE_TEAM_ID='ABCDE12345'
          export APPSTORE_CONNECT_KEY_ID='FGHIJ67890'
          export APPSTORE_CONNECT_ISSUER_ID='12345678-1234-1234-1234-1234567890ab'
          export APPSTORE_CONNECT_PRIVATE_KEY_BASE64="$(/usr/bin/base64 < "$FIXTURE/AuthKey.p8" | tr -d '\n')"

          set +e
          bash Scripts/build-notarized-release.sh >"$LOG" 2>&1
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 0 ]]; then
            cat "$LOG"
            echo 'Production release unexpectedly accepted malformed decoded credential material.' >&2
            exit 1
          fi

          grep -F 'Decoded release credential verification failed: PKCS#12 payload or password is invalid' "$LOG" >/dev/null
          test ! -e release-output
          rm -rf "$FIXTURE"
          rm -f "$LOG"

      - name: Credential-free signing fails closed
        run: |
          rm -rf release-output
          LOG="$RUNNER_TEMP/production-release-fail-closed.log"

          set +e
          (
            export RELEASE_VERSION='0.0.0'
            unset DEVELOPER_ID_P12_BASE64
            unset DEVELOPER_ID_P12_PASSWORD
            unset APPLE_TEAM_ID
            unset APPSTORE_CONNECT_KEY_ID
            unset APPSTORE_CONNECT_ISSUER_ID
            unset APPSTORE_CONNECT_PRIVATE_KEY_BASE64
            bash Scripts/build-notarized-release.sh
          ) >"$LOG" 2>&1
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 0 ]]; then
            cat "$LOG"
            echo 'Production signing unexpectedly succeeded without credentials.' >&2
            exit 1
          fi

          grep -F 'required release environment value is missing: DEVELOPER_ID_P12_BASE64' "$LOG" >/dev/null
          test ! -e release-output
          rm -f "$LOG"

      - name: Release evidence schema fixture
        run: |
          FIXTURE="$RUNNER_TEMP/release-evidence-fixture"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE/SchneeGlass.app/Contents"

          cat > "$FIXTURE/SchneeGlass.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>io.github.lamy210.schneeglass</string>
            <key>CFBundleShortVersionString</key>
            <string>0.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
          </dict>
          </plist>
          PLIST

          ditto -c -k --sequesterRsrc --keepParent \
            "$FIXTURE/SchneeGlass.app" \
            "$FIXTURE/SchneeGlass-0.0.0.zip"

          cat > "$FIXTURE/RELEASE_EVIDENCE.txt" <<'EOF'
          schema_version=1
          version=0.0.0
          notarization_id=12345678-1234-1234-1234-1234567890ab
          notarization_status=Accepted
          codesign=verified
          stapler=validated
          gatekeeper=accepted
          EOF

          bash Scripts/record-release-bundle-metadata.sh \
            0.0.0 \
            "$FIXTURE/SchneeGlass-0.0.0.zip" \
            "$FIXTURE/RELEASE_EVIDENCE.txt"

          echo 'commit_sha=0123456789abcdef0123456789abcdef01234567' >> "$FIXTURE/RELEASE_EVIDENCE.txt"

          bash Scripts/verify-release-evidence.sh \
            "$FIXTURE/RELEASE_EVIDENCE.txt" \
            0.0.0 \
            0123456789abcdef0123456789abcdef01234567

          printf 'unknown_key=forbidden\n' >> "$FIXTURE/RELEASE_EVIDENCE.txt"
          if bash Scripts/verify-release-evidence.sh \
            "$FIXTURE/RELEASE_EVIDENCE.txt" \
            0.0.0 \
            0123456789abcdef0123456789abcdef01234567; then
            echo 'Release evidence validator unexpectedly accepted an unknown key.' >&2
            exit 1
          fi

          rm -rf "$FIXTURE"

      - name: Requested version matches project
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bash Scripts/verify-release-metadata.sh "v${REQUESTED_VERSION}"

  sign-notarize:
    name: Developer ID / Notarize / Staple / Gatekeeper
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_sign_and_notarize && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    environment: production-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_VERSION: ${{ inputs.version }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_CONNECT_KEY_ID: ${{ vars.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ vars.APPSTORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Build signed and notarized release candidate
        run: bash Scripts/build-notarized-release.sh

      - name: Initialize release evidence schema
        run: |
          EVIDENCE='release-output/RELEASE_EVIDENCE.txt'
          test -f "$EVIDENCE"
          ! grep -q '^schema_version=' "$EVIDENCE"
          TEMP="$RUNNER_TEMP/RELEASE_EVIDENCE.txt"
          {
            echo 'schema_version=1'
            cat "$EVIDENCE"
          } > "$TEMP"
          mv "$TEMP" "$EVIDENCE"

      - name: Record and verify signed bundle metadata
        run: bash Scripts/record-release-bundle-metadata.sh "$RELEASE_VERSION"

      - name: Record signed source commit
        run: echo "commit_sha=$GITHUB_SHA" >> release-output/RELEASE_EVIDENCE.txt

      - name: Validate complete release evidence
        run: bash Scripts/verify-release-evidence.sh release-output/RELEASE_EVIDENCE.txt "$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Upload signed notarized candidate for manual QA
        uses: actions/upload-artifact@v4
        with:
          name: SchneeGlass-${{ inputs.version }}-signed-notarized-candidate
          path: release-output/
          if-no-files-found: error
          retention-days: 14
