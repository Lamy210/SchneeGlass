name: Special File AT RED Verification

on:
  push:
    branches:
      - bootstrap/special-file-at-red

permissions:
  contents: read

jobs:
  special-file-at-red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify descriptor-relative special-file RED fixture
        run: bash Scripts/test-file-safety-special-file-references.sh
