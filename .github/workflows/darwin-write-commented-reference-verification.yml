name: Darwin Write Commented Reference Verification
# Verification rerun against fixed feature head b9e2d3b80e84fd0f5376d458f4dd662f4d9e0061
on:
  push:
    branches:
      - bootstrap/darwin-write-comment-verification
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/detect-commented-darwin-write-reference
      - name: Test raw-write references
        run: bash Scripts/test-file-safety-write-references.sh
