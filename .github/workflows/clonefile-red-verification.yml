name: Clonefile RED Verification

on:
  push:
    branches:
      - 'bootstrap/clonefile-red'

permissions:
  contents: read

jobs:
  clonefile-red:
    name: Clonefile RED fixture
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run clonefile File Safety fixture
        run: bash Scripts/test-file-safety-clonefile-references.sh
