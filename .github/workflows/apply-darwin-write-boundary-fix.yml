name: Apply Darwin Write Boundary Fix

on:
  push:
    branches:
      - bootstrap/darwin-write-boundary-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/bound-darwin-write-direct-call
          fetch-depth: 0

      - name: Apply exact classifier boundary patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('Scripts/verify-file-safety.sh')
          text = path.read_text()
          old = "scan_pattern 'Darwin.write' 'Darwin\\.write\\(|=[[:space:]]*Darwin\\.write[[:space:]]*$|(\\(|\\[|,|:)[[:space:]]*Darwin\\.write[[:space:]]*(\\)|\\]|,)|return[[:space:]]+Darwin\\.write([^[:alnum:]_]|$)'"
          new = "scan_pattern 'Darwin.write' '(^|[^[:alnum:]_])Darwin\\.write\\(|=[[:space:]]*Darwin\\.write[[:space:]]*$|(\\(|\\[|,|:)[[:space:]]*Darwin\\.write[[:space:]]*(\\)|\\]|,)|return[[:space:]]+Darwin\\.write([^[:alnum:]_]|$)'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected Darwin.write classifier once, found {count}')
          path.write_text(text.replace(old, new))

      - name: Commit and push fix
        run: |
          git config user.name 'Lamy210'
          git config user.email '90091196+Lamy210@users.noreply.github.com'
          git add Scripts/verify-file-safety.sh
          git commit -m 'safety: bound Darwin.write direct-call classifier'
          git push origin HEAD:fix/bound-darwin-write-direct-call
