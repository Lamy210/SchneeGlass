name: CodeQL Swift Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 2'
  pull_request:
    paths:
      - '.github/workflows/codeql.yml'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: SwiftPM Core / CodeQL v4 / Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build analyzed SwiftPM core
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64|x86_64) ;;
            *)
              echo "Unsupported runner architecture for CodeQL build: $ARCH" >&2
              exit 1
              ;;
          esac

          swift build \
            --package-path Packages/SchneeGlassKit \
            --arch "$ARCH"

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:swiftpm-core'
