name: Block Comment Raw Write Verification
# GREEN verification feature commit c7d75fe26704a3212b8cabe06b9e0ea5ff47dfb3
on:
  push:
    branches:
      - bootstrap/block-comment-raw-write-verification
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/classify-block-commented-raw-write-references
      - name: Verify raw-write references
        run: bash Scripts/test-file-safety-write-references.sh
