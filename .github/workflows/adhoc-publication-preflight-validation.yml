name: Ad-Hoc Publication Preflight Validation

on:
  pull_request:
    paths:
      - '.github/workflows/adhoc-publication-preflight-validation.yml'
      - 'Scripts/verify-adhoc-publication-preflight.sh'
      - 'Scripts/test-verify-adhoc-publication-preflight.py'
      - 'Scripts/verify-current-release-governance.sh'
      - 'Scripts/verify-adhoc-candidate-approval-chain.sh'
      - 'Scripts/materialize-authenticated-adhoc-release-history.sh'
      - 'Scripts/verify-adhoc-candidate-build-history.sh'
      - 'Scripts/verify-adhoc-release-slot.sh'
      - 'Scripts/verify-adhoc-run-artifact-from-github.sh'

permissions:
  contents: read

jobs:
  fixture:
    name: Ad-Hoc Publication Preflight / Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax
        run: |
          bash -n Scripts/verify-adhoc-publication-preflight.sh
          python3 -m py_compile Scripts/test-verify-adhoc-publication-preflight.py

      - name: Fail-closed ordered preflight regression fixtures
        run: python3 Scripts/test-verify-adhoc-publication-preflight.py
