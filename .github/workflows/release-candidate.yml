name: Release Candidate Validation

on:
  pull_request:
    paths:
      - '.github/workflows/release-candidate.yml'
      - 'Scripts/verify-xcode-version.sh'
      - 'Scripts/verify-release-metadata.sh'
      - 'Scripts/verify-required-plist-value.sh'
      - 'SchneeGlass.xcodeproj/project.pbxproj'
      - 'RELEASE.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected X.Y.Z version. Leave empty to validate the project version only.'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Supersede only older runs for the same pull request. Tag and manual runs use the
# unique run ID fallback, so independent release validations never share a group.
concurrency:
  group: release-candidate-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-release-candidate:
    name: Unsigned Release Candidate / Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          bash Scripts/verify-xcode-version.sh 'Xcode 26.6'
          swift --version

      - name: Validate release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash Scripts/verify-release-metadata.sh "$GITHUB_REF_NAME"
          elif [[ -n "${REQUESTED_VERSION:-}" ]]; then
            bash Scripts/verify-release-metadata.sh "v${REQUESTED_VERSION}"
          else
            bash Scripts/verify-release-metadata.sh
          fi

      - name: Resolve release version
        id: release
        run: |
          SETTINGS="$(xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Release \
            -showBuildSettings)"
          VERSION="$(printf '%s\n' "$SETTINGS" \
            | sed -n 's/^[[:space:]]*MARKETING_VERSION = //p' \
            | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: Build unsigned Release candidate
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify unsigned app baseline
        run: |
          APP="$RUNNER_TEMP/SchneeGlassReleaseDerivedData/Build/Products/Release/SchneeGlass.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/SchneeGlass"
          plutil -lint "$APP/Contents/Info.plist"
          bash Scripts/verify-required-plist-value.sh "$APP/Contents/Info.plist" 'CFBundleIdentifier' 'io.github.lamy210.schneeglass' 'Unsigned release candidate'
          bash Scripts/verify-required-plist-value.sh "$APP/Contents/Info.plist" 'CFBundleShortVersionString' '${{ steps.release.outputs.version }}' 'Unsigned release candidate'
          plutil -lint App/SchneeGlass.entitlements
          bash Scripts/verify-required-plist-value.sh App/SchneeGlass.entitlements 'com.apple.security.app-sandbox' 'true' 'Unsigned release candidate'

      - name: Package release candidate and integrity manifest
        run: |
          VERSION='${{ steps.release.outputs.version }}'
          APP="$RUNNER_TEMP/SchneeGlassReleaseDerivedData/Build/Products/Release/SchneeGlass.app"
          ARCHIVE="SchneeGlass-${VERSION}-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Upload validated unsigned release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SchneeGlass-${{ steps.release.outputs.version }}-unsigned-release-candidate
          path: |
            SchneeGlass-${{ steps.release.outputs.version }}-unsigned.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
