name: Release Candidate Validation

on:
  pull_request:
    paths:
      - '.github/workflows/release-candidate.yml'
      - 'Scripts/verify-release-metadata.sh'
      - 'SchneeGlass.xcodeproj/project.pbxproj'
      - 'RELEASE.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected X.Y.Z version. Leave empty to validate the project version only.'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# PR heads share a PR-number group so a newer commit cancels stale validation.
# Tag and workflow_dispatch runs use their run ID so independent release validations never cancel each other.
concurrency:
  group: release-candidate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-release-candidate:
    name: Unsigned Release Candidate / Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Release candidate concurrency policy
        run: |
          CONCURRENCY_BLOCK="$(sed -n '/^concurrency:$/,/^jobs:/p' .github/workflows/release-candidate.yml)"

          printf '%s\n' "$CONCURRENCY_BLOCK" | grep -F "github.event_name == 'pull_request'" >/dev/null || {
            echo 'Release Candidate concurrency must distinguish pull_request events.' >&2
            exit 1
          }
          printf '%s\n' "$CONCURRENCY_BLOCK" | grep -F 'github.event.pull_request.number' >/dev/null || {
            echo 'Release Candidate concurrency must group pull_request runs by PR number.' >&2
            exit 1
          }
          printf '%s\n' "$CONCURRENCY_BLOCK" | grep -F 'github.run_id' >/dev/null || {
            echo 'Release Candidate concurrency must keep non-PR runs independent by run id.' >&2
            exit 1
          }
          printf '%s\n' "$CONCURRENCY_BLOCK" | grep -F 'cancel-in-progress:' | grep -F "github.event_name == 'pull_request'" >/dev/null || {
            echo 'Release Candidate concurrency must cancel only pull_request runs.' >&2
            exit 1
          }

      - name: Validate release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash Scripts/verify-release-metadata.sh "$GITHUB_REF_NAME"
          elif [[ -n "${REQUESTED_VERSION:-}" ]]; then
            bash Scripts/verify-release-metadata.sh "v${REQUESTED_VERSION}"
          else
            bash Scripts/verify-release-metadata.sh
          fi

      - name: Resolve release version
        id: release
        run: |
          SETTINGS="$(xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Release \
            -showBuildSettings)"
          VERSION="$(printf '%s\n' "$SETTINGS" \
            | sed -n 's/^[[:space:]]*MARKETING_VERSION = //p' \
            | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: Build unsigned Release candidate
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify unsigned app baseline
        run: |
          APP="$RUNNER_TEMP/SchneeGlassReleaseDerivedData/Build/Products/Release/SchneeGlass.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/SchneeGlass"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'io.github.lamy210.schneeglass'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = '${{ steps.release.outputs.version }}'
          plutil -lint App/SchneeGlass.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' App/SchneeGlass.entitlements)" = 'true'

      - name: Package release candidate and integrity manifest
        run: |
          VERSION='${{ steps.release.outputs.version }}'
          APP="$RUNNER_TEMP/SchneeGlassReleaseDerivedData/Build/Products/Release/SchneeGlass.app"
          ARCHIVE="SchneeGlass-${VERSION}-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Upload validated unsigned release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SchneeGlass-${{ steps.release.outputs.version }}-unsigned-release-candidate
          path: |
            SchneeGlass-${{ steps.release.outputs.version }}-unsigned.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
