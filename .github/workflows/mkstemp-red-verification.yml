name: Mkstemp RED Verification

on:
  push:
    branches:
      - bootstrap/mkstemp-red

permissions:
  contents: read

jobs:
  mkstemp-red:
    name: Mkstemp RED fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run write File Safety fixture
        run: bash Scripts/test-file-safety-write-references.sh
