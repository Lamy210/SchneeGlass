name: Ad-Hoc Release Slot Validation

on:
  pull_request:
    paths:
      - '.github/workflows/adhoc-release-slot-validation.yml'
      - 'Scripts/verify-adhoc-release-slot.sh'
      - 'Scripts/test-verify-adhoc-release-slot.sh'

permissions:
  contents: read

jobs:
  fixture:
    name: Ad-Hoc Release Slot / Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell syntax
        run: |
          bash -n Scripts/verify-adhoc-release-slot.sh
          bash -n Scripts/test-verify-adhoc-release-slot.sh

      - name: Release and tag collision negative fixtures
        run: bash Scripts/test-verify-adhoc-release-slot.sh
