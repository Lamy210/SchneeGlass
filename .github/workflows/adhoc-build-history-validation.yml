name: Ad-Hoc Build History Validation

on:
  pull_request:
    paths:
      - '.github/workflows/adhoc-build-history-validation.yml'
      - 'Scripts/verify-adhoc-candidate-build-history.sh'
      - 'Scripts/test-verify-adhoc-candidate-build-history.sh'
      - 'Scripts/verify-adhoc-candidate-artifact.sh'
      - 'Scripts/verify-release-build-history.sh'
      - 'Scripts/verify-release-checksum-manifest.sh'

permissions:
  contents: read

jobs:
  fixture:
    name: Ad-Hoc Build History / Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell syntax
        run: |
          bash -n Scripts/verify-adhoc-candidate-build-history.sh
          bash -n Scripts/test-verify-adhoc-candidate-build-history.sh

      - name: Candidate identity and monotonic build regression fixtures
        run: bash Scripts/test-verify-adhoc-candidate-build-history.sh
