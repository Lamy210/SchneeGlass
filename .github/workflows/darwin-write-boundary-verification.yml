name: Darwin Write Boundary Verification

on:
  push:
    branches:
      - bootstrap/darwin-write-boundary-red-run
      - bootstrap/darwin-write-boundary-green-run

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run write-reference fixture
        run: bash Scripts/test-file-safety-write-references.sh
