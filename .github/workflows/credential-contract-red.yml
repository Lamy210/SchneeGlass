name: Release Credential Contract RED

on:
  pull_request:
    paths:
      - '.github/workflows/credential-contract-red.yml'
      - 'Scripts/verify-release-credential-inputs.sh'

permissions:
  contents: read

jobs:
  contract:
    name: Credential Contract / Expected Valid Inputs
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Valid credential metadata should pass
        env:
          RELEASE_VERSION: '0.1.0'
          DEVELOPER_ID_P12_BASE64: 'QQ=='
          DEVELOPER_ID_P12_PASSWORD: 'fixture-password'
          APPLE_TEAM_ID: 'ABCDE12345'
          APPSTORE_CONNECT_KEY_ID: 'FGHIJ67890'
          APPSTORE_CONNECT_ISSUER_ID: '12345678-1234-1234-1234-1234567890ab'
          APPSTORE_CONNECT_PRIVATE_KEY_BASE64: 'Qg=='
        run: bash Scripts/verify-release-credential-inputs.sh
