name: Publish Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact X.Y.Z version to publish.'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful Production Release Candidate workflow run ID.'
        required: true
        type: string
      confirm_manual_qa:
        description: 'Confirm docs/MANUAL_QA.md passed for this exact signed candidate.'
        required: true
        default: false
        type: boolean
      confirm_immutable_releases:
        description: 'Confirm repository Settings > Releases > Enable release immutability is enabled.'
        required: true
        default: false
        type: boolean
      confirm_release_governance:
        description: 'Confirm main branch/release governance and required CI protections were reviewed for this release.'
        required: true
        default: false
        type: boolean
      confirm_publish:
        description: 'Publish the public GitHub Release.'
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/publish-release.yml'
      - '.github/rulesets/main-release-governance.json'
      - 'Scripts/publish-notarized-release.sh'
      - 'Scripts/verify-production-candidate-run.sh'
      - 'Scripts/verify-release-build-history.sh'
      - 'Scripts/verify-release-evidence.sh'
      - 'Scripts/verify-release-branch-protection.sh'
      - 'Scripts/verify-release-required-branch-rules.sh'
      - 'Scripts/verify-release-required-checks.sh'

permissions:
  contents: read

concurrency:
  group: production-release-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Release Publication / Credential-free Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Required tooling
        run: |
          command -v bash
          command -v git
          command -v gh
          command -v jq
          command -v shasum

      - name: Shell syntax
        run: |
          bash -n Scripts/publish-notarized-release.sh
          bash -n Scripts/verify-production-candidate-run.sh
          bash -n Scripts/verify-release-build-history.sh
          bash -n Scripts/verify-release-evidence.sh
          bash -n Scripts/verify-release-branch-protection.sh
          bash -n Scripts/verify-release-required-branch-rules.sh
          bash -n Scripts/verify-release-required-checks.sh

      - name: Production candidate run policy fixture
        run: |
          SHA='0123456789abcdef0123456789abcdef01234567'

          bash Scripts/verify-production-candidate-run.sh \
            'Production Release Candidate' \
            '.github/workflows/production-release.yml' \
            'workflow_dispatch' \
            'completed' \
            'success' \
            'main' \
            "$SHA"

          if bash Scripts/verify-production-candidate-run.sh \
            'Production Release Candidate' \
            '.github/workflows/lookalike-release.yml' \
            'workflow_dispatch' \
            'completed' \
            'success' \
            'main' \
            "$SHA"; then
            echo 'Candidate validator unexpectedly accepted a lookalike workflow path.' >&2
            exit 1
          fi

      - name: Monotonic build history fixture
        run: |
          FIXTURE="$RUNNER_TEMP/release-build-history-fixture"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE/history/one" "$FIXTURE/history/two"

          cat > "$FIXTURE/current.txt" <<'EOF'
          schema_version=1
          bundle_build=5
          EOF
          cat > "$FIXTURE/history/one/RELEASE_EVIDENCE.txt" <<'EOF'
          schema_version=1
          bundle_build=1
          EOF
          cat > "$FIXTURE/history/two/RELEASE_EVIDENCE.txt" <<'EOF'
          schema_version=1
          bundle_build=4
          EOF

          bash Scripts/verify-release-build-history.sh "$FIXTURE/current.txt" "$FIXTURE/history"

          sed -i 's/bundle_build=5/bundle_build=4/' "$FIXTURE/current.txt"
          if bash Scripts/verify-release-build-history.sh "$FIXTURE/current.txt" "$FIXTURE/history"; then
            echo 'Build history validator unexpectedly accepted a reused build number.' >&2
            exit 1
          fi

          rm -rf "$FIXTURE"

      - name: Publication script fails closed without explicit inputs
        run: |
          LOG="$RUNNER_TEMP/release-promotion-fail-closed.log"
          set +e
          (
            unset RELEASE_VERSION
            unset CANDIDATE_RUN_ID
            unset CONFIRM_MANUAL_QA
            unset CONFIRM_IMMUTABLE_RELEASES
            unset CONFIRM_RELEASE_GOVERNANCE
            unset CONFIRM_PUBLISH
            bash Scripts/publish-notarized-release.sh
          ) >"$LOG" 2>&1
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 0 ]]; then
            cat "$LOG"
            echo 'Release publication unexpectedly succeeded without explicit inputs.' >&2
            exit 1
          fi

          grep -F 'required promotion environment value is missing: RELEASE_VERSION' "$LOG" >/dev/null
          rm -f "$LOG"

      - name: Publication requires release governance confirmation
        run: |
          LOG="$RUNNER_TEMP/release-governance-fail-closed.log"
          set +e
          (
            export RELEASE_VERSION='0.0.0'
            export CANDIDATE_RUN_ID='1'
            export GITHUB_REPOSITORY='example/example'
            export GITHUB_REF='refs/heads/main'
            export GH_TOKEN='fixture-token'
            export CONFIRM_MANUAL_QA='true'
            export CONFIRM_IMMUTABLE_RELEASES='true'
            export CONFIRM_RELEASE_GOVERNANCE='false'
            export CONFIRM_PUBLISH='true'
            bash Scripts/publish-notarized-release.sh
          ) >"$LOG" 2>&1
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 0 ]]; then
            cat "$LOG"
            echo 'Release publication unexpectedly accepted missing governance confirmation.' >&2
            exit 1
          fi

          grep -F 'release governance confirmation is required' "$LOG" >/dev/null
          rm -f "$LOG"

      - name: Branch protection policy fixture
        run: |
          bash Scripts/verify-release-branch-protection.sh main true

          if bash Scripts/verify-release-branch-protection.sh main false; then
            echo 'Branch protection validator unexpectedly accepted unprotected main.' >&2
            exit 1
          fi

          if bash Scripts/verify-release-branch-protection.sh develop true; then
            echo 'Branch protection validator unexpectedly accepted a non-main branch.' >&2
            exit 1
          fi

          if bash Scripts/verify-release-branch-protection.sh main unknown; then
            echo 'Branch protection validator unexpectedly accepted an unknown protection state.' >&2
            exit 1
          fi

      - name: Required branch rules policy fixture
        run: |
          FIXTURE="$RUNNER_TEMP/release-required-branch-rules-fixture"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"

          cat > "$FIXTURE/rules-pages.json" <<'EOF'
          [
            [
              {"type": "deletion"},
              {"type": "non_fast_forward"},
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 0,
                  "required_review_thread_resolution": true
                }
              },
              {"type": "required_status_checks", "parameters": {"required_status_checks": []}}
            ]
          ]
          EOF

          bash Scripts/verify-release-required-branch-rules.sh \
            "$FIXTURE/rules-pages.json" \
            deletion \
            non_fast_forward \
            pull_request

          for missing_rule in deletion non_fast_forward pull_request; do
            jq --arg missing_rule "$missing_rule" \
              'map(map(select(.type != $missing_rule)))' \
              "$FIXTURE/rules-pages.json" > "$FIXTURE/missing.json"

            if bash Scripts/verify-release-required-branch-rules.sh \
              "$FIXTURE/missing.json" \
              deletion \
              non_fast_forward \
              pull_request; then
              echo "Branch-rule validator unexpectedly accepted missing rule: $missing_rule" >&2
              exit 1
            fi
          done

          for invalid_review_resolution in false missing string; do
            case "$invalid_review_resolution" in
              false)
                jq 'map(map(if .type == "pull_request" then .parameters.required_review_thread_resolution = false else . end))' \
                  "$FIXTURE/rules-pages.json" > "$FIXTURE/invalid-review-resolution.json"
                ;;
              missing)
                jq 'map(map(if .type == "pull_request" then del(.parameters.required_review_thread_resolution) else . end))' \
                  "$FIXTURE/rules-pages.json" > "$FIXTURE/invalid-review-resolution.json"
                ;;
              string)
                jq 'map(map(if .type == "pull_request" then .parameters.required_review_thread_resolution = "true" else . end))' \
                  "$FIXTURE/rules-pages.json" > "$FIXTURE/invalid-review-resolution.json"
                ;;
            esac

            if bash Scripts/verify-release-required-branch-rules.sh \
              "$FIXTURE/invalid-review-resolution.json" \
              deletion \
              non_fast_forward \
              pull_request; then
              echo "Branch-rule validator unexpectedly accepted invalid review-thread resolution: $invalid_review_resolution" >&2
              exit 1
            fi
          done

          jq 'map(map(if .type == "pull_request" then .parameters.required_approving_review_count = 1 else . end))' \
            "$FIXTURE/rules-pages.json" > "$FIXTURE/stronger-review-count.json"
          bash Scripts/verify-release-required-branch-rules.sh \
            "$FIXTURE/stronger-review-count.json" \
            deletion \
            non_fast_forward \
            pull_request

          printf '{}\n' > "$FIXTURE/malformed.json"
          if bash Scripts/verify-release-required-branch-rules.sh \
            "$FIXTURE/malformed.json" \
            deletion \
            non_fast_forward \
            pull_request; then
            echo 'Branch-rule validator unexpectedly accepted malformed rule pages.' >&2
            exit 1
          fi

          rm -rf "$FIXTURE"

      - name: Required Bootstrap CI policy fixture
        run: |
          FIXTURE="$RUNNER_TEMP/release-required-checks-fixture"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"

          GITHUB_ACTIONS_APP_ID='15368'
          CANONICAL='Canonical / Xcode 26.6 / App Build / Safety Guards'
          COMPATIBILITY='Compatibility / macOS 15 / App Build'

          cat > "$FIXTURE/branch.json" <<EOF
          {
            "protected": true,
            "protection": {
              "required_status_checks": {
                "contexts": ["$CANONICAL"],
                "checks": [
                  {"context": "$CANONICAL", "app_id": $GITHUB_ACTIONS_APP_ID}
                ]
              }
            }
          }
          EOF

          cat > "$FIXTURE/rules-pages.json" <<EOF
          [
            [
              {
                "type": "required_status_checks",
                "parameters": {
                  "required_status_checks": [
                    {"context": "$CANONICAL", "integration_id": $GITHUB_ACTIONS_APP_ID},
                    {"context": "$COMPATIBILITY", "integration_id": $GITHUB_ACTIONS_APP_ID}
                  ],
                  "strict_required_status_checks_policy": true
                }
              }
            ]
          ]
          EOF

          bash Scripts/verify-release-required-checks.sh \
            "$FIXTURE/branch.json" \
            "$FIXTURE/rules-pages.json" \
            "$GITHUB_ACTIONS_APP_ID" \
            "$CANONICAL" \
            "$COMPATIBILITY"

          for invalid_strict_policy in false missing string; do
            case "$invalid_strict_policy" in
              false)
                jq 'map(map(if .type == "required_status_checks" then .parameters.strict_required_status_checks_policy = false else . end))' \
                  "$FIXTURE/rules-pages.json" > "$FIXTURE/invalid-strict-policy.json"
                ;;
              missing)
                jq 'map(map(if .type == "required_status_checks" then del(.parameters.strict_required_status_checks_policy) else . end))' \
                  "$FIXTURE/rules-pages.json" > "$FIXTURE/invalid-strict-policy.json"
                ;;
              string)
                jq 'map(map(if .type == "required_status_checks" then .parameters.strict_required_status_checks_policy = "true" else . end))' \
                  "$FIXTURE/rules-pages.json" > "$FIXTURE/invalid-strict-policy.json"
                ;;
            esac

            if bash Scripts/verify-release-required-checks.sh \
              "$FIXTURE/branch.json" \
              "$FIXTURE/invalid-strict-policy.json" \
              "$GITHUB_ACTIONS_APP_ID" \
              "$CANONICAL" \
              "$COMPATIBILITY"; then
              echo "Required-check validator unexpectedly accepted invalid strict policy: $invalid_strict_policy" >&2
              exit 1
            fi
          done

          cat > "$FIXTURE/rules-pages.json" <<'EOF'
          [[]]
          EOF
          if bash Scripts/verify-release-required-checks.sh \
            "$FIXTURE/branch.json" \
            "$FIXTURE/rules-pages.json" \
            "$GITHUB_ACTIONS_APP_ID" \
            "$CANONICAL" \
            "$COMPATIBILITY"; then
            echo 'Required-check validator unexpectedly accepted a missing compatibility check.' >&2
            exit 1
          fi

          cat > "$FIXTURE/branch.json" <<EOF
          {
            "protected": true,
            "protection": {
              "required_status_checks": {
                "contexts": ["$CANONICAL", "$COMPATIBILITY"],
                "checks": []
              }
            }
          }
          EOF
          if bash Scripts/verify-release-required-checks.sh \
            "$FIXTURE/branch.json" \
            "$FIXTURE/rules-pages.json" \
            "$GITHUB_ACTIONS_APP_ID" \
            "$CANONICAL" \
            "$COMPATIBILITY"; then
            echo 'Required-check validator unexpectedly accepted source-unbound classic contexts.' >&2
            exit 1
          fi

          cat > "$FIXTURE/branch.json" <<EOF
          {
            "protected": true,
            "protection": {
              "required_status_checks": {
                "contexts": [],
                "checks": [
                  {"context": "$CANONICAL", "app_id": 99999},
                  {"context": "$COMPATIBILITY", "app_id": $GITHUB_ACTIONS_APP_ID}
                ]
              }
            }
          }
          EOF
          if bash Scripts/verify-release-required-checks.sh \
            "$FIXTURE/branch.json" \
            "$FIXTURE/rules-pages.json" \
            "$GITHUB_ACTIONS_APP_ID" \
            "$CANONICAL" \
            "$COMPATIBILITY"; then
            echo 'Required-check validator unexpectedly accepted the canonical check from another app.' >&2
            exit 1
          fi

          cat > "$FIXTURE/branch.json" <<EOF
          {
            "protected": true,
            "protection": {
              "required_status_checks": {
                "contexts": [],
                "checks": [
                  {"context": "$CANONICAL", "app_id": $GITHUB_ACTIONS_APP_ID},
                  {"context": "$COMPATIBILITY", "app_id": $GITHUB_ACTIONS_APP_ID}
                ]
              }
            }
          }
          EOF
          if bash Scripts/verify-release-required-checks.sh \
            "$FIXTURE/branch.json" \
            "$FIXTURE/rules-pages.json" \
            "$GITHUB_ACTIONS_APP_ID" \
            "$CANONICAL" \
            "$COMPATIBILITY"; then
            echo 'Required-check validator unexpectedly accepted strict-policy-unproven classic checks.' >&2
            exit 1
          fi

          cat > "$FIXTURE/rules-pages.json" <<EOF
          [
            [
              {
                "type": "required_status_checks",
                "parameters": {
                  "required_status_checks": [
                    {"context": "$CANONICAL", "integration_id": $GITHUB_ACTIONS_APP_ID},
                    {"context": "$COMPATIBILITY", "integration_id": $GITHUB_ACTIONS_APP_ID}
                  ],
                  "strict_required_status_checks_policy": true
                }
              }
            ]
          ]
          EOF
          bash Scripts/verify-release-required-checks.sh \
            "$FIXTURE/branch.json" \
            "$FIXTURE/rules-pages.json" \
            "$GITHUB_ACTIONS_APP_ID" \
            "$CANONICAL" \
            "$COMPATIBILITY"

          rm -rf "$FIXTURE"

      - name: Repository ruleset recipe fixture
        run: |
          FIXTURE="$RUNNER_TEMP/release-ruleset-recipe-fixture"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"

          RECIPE='.github/rulesets/main-release-governance.json'
          GITHUB_ACTIONS_APP_ID='15368'
          CANONICAL='Canonical / Xcode 26.6 / App Build / Safety Guards'
          COMPATIBILITY='Compatibility / macOS 15 / App Build'

          jq -e '
            .name == "SchneeGlass main release governance" and
            .target == "branch" and
            .enforcement == "active" and
            .bypass_actors == [] and
            .conditions.ref_name.include == ["refs/heads/main"] and
            .conditions.ref_name.exclude == [] and
            any(.rules[]; .type == "pull_request" and .parameters.required_approving_review_count == 0) and
            any(.rules[]; .type == "pull_request" and .parameters.required_review_thread_resolution == true)
          ' "$RECIPE" >/dev/null

          printf '{}\n' > "$FIXTURE/branch.json"
          jq '[.rules]' "$RECIPE" > "$FIXTURE/rules-pages.json"

          bash Scripts/verify-release-required-branch-rules.sh \
            "$FIXTURE/rules-pages.json" \
            deletion \
            non_fast_forward \
            pull_request

          bash Scripts/verify-release-required-checks.sh \
            "$FIXTURE/branch.json" \
            "$FIXTURE/rules-pages.json" \
            "$GITHUB_ACTIONS_APP_ID" \
            "$CANONICAL" \
            "$COMPATIBILITY"

          rm -rf "$FIXTURE"

      - name: Governance metadata API availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_JSON="$RUNNER_TEMP/governance-api-main-branch.json"
          RULES_PAGES_JSON="$RUNNER_TEMP/governance-api-main-rules-pages.json"

          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$BRANCH_JSON"
          jq -e 'type == "object" and (.protected | type == "boolean")' "$BRANCH_JSON" >/dev/null

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" \
            > "$RULES_PAGES_JSON"
          jq -e 'type == "array" and all(.[]; type == "array")' "$RULES_PAGES_JSON" >/dev/null

  publish:
    name: Promote Signed Candidate to Immutable GitHub Release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_manual_qa &&
      inputs.confirm_immutable_releases &&
      inputs.confirm_release_governance &&
      inputs.confirm_publish &&
      github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CONFIRM_MANUAL_QA: ${{ inputs.confirm_manual_qa }}
      CONFIRM_IMMUTABLE_RELEASES: ${{ inputs.confirm_immutable_releases }}
      CONFIRM_RELEASE_GOVERNANCE: ${{ inputs.confirm_release_governance }}
      CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}

    steps:
      - name: Checkout main release control plane
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify current main release governance
        run: |
          BRANCH_JSON="$RUNNER_TEMP/main-branch.json"
          RULES_PAGES_JSON="$RUNNER_TEMP/main-rules-pages.json"
          GITHUB_ACTIONS_APP_ID='15368'
          CANONICAL='Canonical / Xcode 26.6 / App Build / Safety Guards'
          COMPATIBILITY='Compatibility / macOS 15 / App Build'

          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$BRANCH_JSON"
          MAIN_PROTECTED="$(jq -r '.protected' "$BRANCH_JSON")"
          bash Scripts/verify-release-branch-protection.sh main "$MAIN_PROTECTED"

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" \
            > "$RULES_PAGES_JSON"
          bash Scripts/verify-release-required-checks.sh \
            "$BRANCH_JSON" \
            "$RULES_PAGES_JSON" \
            "$GITHUB_ACTIONS_APP_ID" \
            "$CANONICAL" \
            "$COMPATIBILITY"
          bash Scripts/verify-release-required-branch-rules.sh \
            "$RULES_PAGES_JSON" \
            deletion \
            non_fast_forward \
            pull_request

      - name: Publish validated notarized candidate
        run: bash Scripts/publish-notarized-release.sh
