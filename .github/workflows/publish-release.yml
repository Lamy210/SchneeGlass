name: Publish Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact X.Y.Z version to publish.'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful Production Release Candidate workflow run ID.'
        required: true
        type: string
      confirm_manual_qa:
        description: 'Confirm docs/MANUAL_QA.md passed for this exact signed candidate.'
        required: true
        default: false
        type: boolean
      confirm_immutable_releases:
        description: 'Confirm repository Settings > Releases > Enable release immutability is enabled.'
        required: true
        default: false
        type: boolean
      confirm_release_governance:
        description: 'Confirm main branch/release governance and required CI protections were reviewed for this release.'
        required: true
        default: false
        type: boolean
      confirm_publish:
        description: 'Publish the public GitHub Release.'
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/publish-release.yml'
      - 'Scripts/publish-notarized-release.sh'
      - 'Scripts/verify-production-candidate-run.sh'
      - 'Scripts/verify-release-build-history.sh'
      - 'Scripts/verify-release-evidence.sh'
      - 'Scripts/verify-release-branch-protection.sh'

permissions:
  contents: read

concurrency:
  group: production-release-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Release Publication / Credential-free Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Required tooling
        run: |
          command -v bash
          command -v git
          command -v gh
          command -v shasum

      - name: Shell syntax
        run: |
          bash -n Scripts/publish-notarized-release.sh
          bash -n Scripts/verify-production-candidate-run.sh
          bash -n Scripts/verify-release-build-history.sh
          bash -n Scripts/verify-release-evidence.sh
          bash -n Scripts/verify-release-branch-protection.sh

      - name: Production candidate run policy fixture
        run: |
          SHA='0123456789abcdef0123456789abcdef01234567'

          bash Scripts/verify-production-candidate-run.sh \
            'Production Release Candidate' \
            '.github/workflows/production-release.yml' \
            'workflow_dispatch' \
            'completed' \
            'success' \
            'main' \
            "$SHA"

          if bash Scripts/verify-production-candidate-run.sh \
            'Production Release Candidate' \
            '.github/workflows/lookalike-release.yml' \
            'workflow_dispatch' \
            'completed' \
            'success' \
            'main' \
            "$SHA"; then
            echo 'Candidate validator unexpectedly accepted a lookalike workflow path.' >&2
            exit 1
          fi

      - name: Monotonic build history fixture
        run: |
          FIXTURE="$RUNNER_TEMP/release-build-history-fixture"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE/history/one" "$FIXTURE/history/two"

          cat > "$FIXTURE/current.txt" <<'EOF'
          schema_version=1
          bundle_build=5
          EOF
          cat > "$FIXTURE/history/one/RELEASE_EVIDENCE.txt" <<'EOF'
          schema_version=1
          bundle_build=1
          EOF
          cat > "$FIXTURE/history/two/RELEASE_EVIDENCE.txt" <<'EOF'
          schema_version=1
          bundle_build=4
          EOF

          bash Scripts/verify-release-build-history.sh "$FIXTURE/current.txt" "$FIXTURE/history"

          sed -i 's/bundle_build=5/bundle_build=4/' "$FIXTURE/current.txt"
          if bash Scripts/verify-release-build-history.sh "$FIXTURE/current.txt" "$FIXTURE/history"; then
            echo 'Build history validator unexpectedly accepted a reused build number.' >&2
            exit 1
          fi

          rm -rf "$FIXTURE"

      - name: Publication script fails closed without explicit inputs
        run: |
          LOG="$RUNNER_TEMP/release-promotion-fail-closed.log"
          set +e
          (
            unset RELEASE_VERSION
            unset CANDIDATE_RUN_ID
            unset CONFIRM_MANUAL_QA
            unset CONFIRM_IMMUTABLE_RELEASES
            unset CONFIRM_RELEASE_GOVERNANCE
            unset CONFIRM_PUBLISH
            bash Scripts/publish-notarized-release.sh
          ) >"$LOG" 2>&1
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 0 ]]; then
            cat "$LOG"
            echo 'Release publication unexpectedly succeeded without explicit inputs.' >&2
            exit 1
          fi

          grep -F 'required promotion environment value is missing: RELEASE_VERSION' "$LOG" >/dev/null
          rm -f "$LOG"

      - name: Publication requires release governance confirmation
        run: |
          LOG="$RUNNER_TEMP/release-governance-fail-closed.log"
          set +e
          (
            export RELEASE_VERSION='0.0.0'
            export CANDIDATE_RUN_ID='1'
            export GITHUB_REPOSITORY='example/example'
            export GITHUB_REF='refs/heads/main'
            export GH_TOKEN='fixture-token'
            export CONFIRM_MANUAL_QA='true'
            export CONFIRM_IMMUTABLE_RELEASES='true'
            export CONFIRM_RELEASE_GOVERNANCE='false'
            export CONFIRM_PUBLISH='true'
            bash Scripts/publish-notarized-release.sh
          ) >"$LOG" 2>&1
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 0 ]]; then
            cat "$LOG"
            echo 'Release publication unexpectedly accepted missing governance confirmation.' >&2
            exit 1
          fi

          grep -F 'release governance confirmation is required' "$LOG" >/dev/null
          rm -f "$LOG"

      - name: Branch protection policy fixture
        run: |
          bash Scripts/verify-release-branch-protection.sh main true

          if bash Scripts/verify-release-branch-protection.sh main false; then
            echo 'Branch protection validator unexpectedly accepted unprotected main.' >&2
            exit 1
          fi

          if bash Scripts/verify-release-branch-protection.sh develop true; then
            echo 'Branch protection validator unexpectedly accepted a non-main branch.' >&2
            exit 1
          fi

          if bash Scripts/verify-release-branch-protection.sh main unknown; then
            echo 'Branch protection validator unexpectedly accepted an unknown protection state.' >&2
            exit 1
          fi

  publish:
    name: Promote Signed Candidate to Immutable GitHub Release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_manual_qa &&
      inputs.confirm_immutable_releases &&
      inputs.confirm_release_governance &&
      inputs.confirm_publish &&
      github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CONFIRM_MANUAL_QA: ${{ inputs.confirm_manual_qa }}
      CONFIRM_IMMUTABLE_RELEASES: ${{ inputs.confirm_immutable_releases }}
      CONFIRM_RELEASE_GOVERNANCE: ${{ inputs.confirm_release_governance }}
      CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}

    steps:
      - name: Checkout main release control plane
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify current main branch protection
        run: |
          MAIN_PROTECTED="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')"
          bash Scripts/verify-release-branch-protection.sh main "$MAIN_PROTECTED"

      - name: Publish validated notarized candidate
        run: bash Scripts/publish-notarized-release.sh
