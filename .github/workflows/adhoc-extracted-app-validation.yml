name: Ad-Hoc Extracted App Validation

on:
  pull_request:
    paths:
      - '.github/workflows/adhoc-extracted-app-validation.yml'
      - 'Scripts/verify-extracted-adhoc-app.sh'
      - 'Scripts/test-verify-extracted-adhoc-app.py'
      - 'Scripts/test-adhoc-extracted-app-workflow-gate.sh'
      - '.github/workflows/adhoc-release-candidate.yml'
      - 'Scripts/verify-required-plist-value.sh'
      - 'Scripts/verify-adhoc-signature-details.sh'
      - 'Scripts/verify-optional-release-entitlements.sh'

permissions:
  contents: read

jobs:
  fixture:
    name: Ad-Hoc Extracted App / Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check syntax
        run: |
          bash -n Scripts/verify-extracted-adhoc-app.sh
          python3 -m py_compile Scripts/test-verify-extracted-adhoc-app.py
          bash -n Scripts/test-adhoc-extracted-app-workflow-gate.sh

      - name: App identity and code signature negative fixtures
        run: python3 Scripts/test-verify-extracted-adhoc-app.py

      - name: Real candidate workflow wiring mutation fixtures
        run: bash Scripts/test-adhoc-extracted-app-workflow-gate.sh
