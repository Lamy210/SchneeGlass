name: Tmpfile GREEN Verification

on:
  push:
    branches:
      - bootstrap/tmpfile-green

permissions:
  contents: read

jobs:
  tmpfile-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify tmpfile GREEN fixture
        run: bash Scripts/test-file-safety-temporary-file-references.sh
