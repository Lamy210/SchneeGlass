name: Publish Unsigned v0.1.0

on:
  push:
    branches:
      - 'release/0.1.0'

permissions:
  contents: write

concurrency:
  group: unsigned-release-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish unsigned v0.1.0
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_VERSION: '0.1.0'
      RELEASE_TAG: 'v0.1.0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          bash Scripts/verify-xcode-version.sh 'Xcode 26.6'
          swift --version

      - name: Validate release metadata
        run: bash Scripts/verify-release-metadata.sh "$RELEASE_TAG"

      - name: Confirm release tag is absent
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 0 ]]; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$STATUS" -ne 2 ]]; then
            echo "Unable to establish release-tag absence (git ls-remote status $STATUS)" >&2
            exit 1
          fi

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: Build unsigned Release app
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassUnsignedReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify unsigned release baseline
        run: |
          APP="$RUNNER_TEMP/SchneeGlassUnsignedReleaseDerivedData/Build/Products/Release/SchneeGlass.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/SchneeGlass"
          plutil -lint "$APP/Contents/Info.plist"
          bash Scripts/verify-required-plist-value.sh "$APP/Contents/Info.plist" 'CFBundleIdentifier' 'io.github.lamy210.schneeglass' 'Unsigned v0.1.0 release'
          bash Scripts/verify-required-plist-value.sh "$APP/Contents/Info.plist" 'CFBundleShortVersionString' "$RELEASE_VERSION" 'Unsigned v0.1.0 release'
          plutil -lint App/SchneeGlass.entitlements
          bash Scripts/verify-required-plist-value.sh App/SchneeGlass.entitlements 'com.apple.security.app-sandbox' 'true' 'Unsigned v0.1.0 release'

          SIGNATURE_DETAILS="$RUNNER_TEMP/unsigned-signature-details.txt"
          set +e
          codesign -dv --verbose=4 "$APP" >"$SIGNATURE_DETAILS" 2>&1
          set -e
          cat "$SIGNATURE_DETAILS"

          if grep -Fq 'Authority=Developer ID Application:' "$SIGNATURE_DETAILS"; then
            echo 'Unsigned release unexpectedly contains a Developer ID Application signature.' >&2
            exit 1
          fi

      - name: Package release and integrity files
        run: |
          APP="$RUNNER_TEMP/SchneeGlassUnsignedReleaseDerivedData/Build/Products/Release/SchneeGlass.app"
          ARCHIVE="SchneeGlass-$RELEASE_VERSION-unsigned.zip"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

          cat > BUILD_INFO.txt <<EOF
          version=$RELEASE_VERSION
          build=1
          source_commit=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          apple_developer_id_signed=false
          apple_notarized=false
          distribution=github-unsigned
          EOF

          cat > RELEASE_NOTES.md <<EOF
          # SchneeGlass v0.1.0

          This is the first public SchneeGlass release.

          **Important:** this build is intentionally **not signed with Apple Developer ID and not notarized by Apple**.

          macOS Gatekeeper may block the first launch. If you trust this repository and the downloaded checksum matches, try opening SchneeGlass once, then open **System Settings → Privacy & Security** and use **Open Anyway** for SchneeGlass.

          ## Integrity

          Verify the downloaded archive with:

          ```bash
          shasum -a 256 -c SHA256SUMS
          ```

          Source commit: `$GITHUB_SHA`

          A Developer ID signed/notarized distribution can be added later without changing the v0.1 source baseline.
          EOF

      - name: Upload unsigned release candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SchneeGlass-0.1.0-unsigned-release
          path: |
            SchneeGlass-0.1.0-unsigned.zip
            SHA256SUMS
            BUILD_INFO.txt
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "SchneeGlass-$RELEASE_VERSION-unsigned.zip" \
            SHA256SUMS \
            BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SchneeGlass v0.1.0 (Unsigned)" \
            --notes-file RELEASE_NOTES.md

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish \
            --jq '
              .tagName == "v0.1.0" and
              .name == "SchneeGlass v0.1.0 (Unsigned)" and
              .isDraft == false and
              .isPrerelease == false
            ' | grep -Fx true >/dev/null
