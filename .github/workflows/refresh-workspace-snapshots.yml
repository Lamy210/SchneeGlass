name: Refresh Workspace Snapshot Baselines

on:
  push:
    branches:
      - 'test/refresh-workspace-unavailable-snapshots'

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '10595115975'
      SOURCE_RUN_ID: '35477796254'
      SOURCE_HEAD_SHA: '18979657f3f05e9e5679c3fd0e4220470207ae5e'
      LIGHT_SHA256: '19f4fb37ab846b80b9db893f76d9cb848db28dfa493a946df7feb3629529835d'
      DARK_SHA256: '23bee4acc403c7da38b3290ce0d7d452e84d410bc11d6a38878dd95fe3cddacf'
      TARGET_DIR: 'Packages/SchneeGlassKit/Tests/SchneeGlassVisualSnapshotTests/__Snapshots__/WorkspaceVisualSnapshotTests'
    steps:
      - name: Checkout baseline branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify canonical artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/artifact.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > "$meta"

          jq -e \
            --argjson run_id "$SOURCE_RUN_ID" \
            --arg head "$SOURCE_HEAD_SHA" \
            '.expired == false
             and .name == "SchneeGlass-visual-snapshot-failure-35477796254-1"
             and .workflow_run.id == $run_id
             and .workflow_run.head_sha == $head' \
            "$meta" >/dev/null

      - name: Restore canonical Workspace references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/snapshot-failure.zip"
          extracted="$RUNNER_TEMP/snapshot-failure"
          mkdir -p "$extracted"

          curl -L --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$zip"
          unzip -q "$zip" -d "$extracted"

          light="$extracted/_temp/visual-snapshot-artifacts/WorkspaceVisualSnapshotTests/populatedLight.macos-26-xcode-26-6.png"
          dark="$extracted/_temp/visual-snapshot-artifacts/WorkspaceVisualSnapshotTests/populatedDark.macos-26-xcode-26-6.png"
          test -f "$light"
          test -f "$dark"

          printf '%s  %s\n' "$LIGHT_SHA256" "$light" | sha256sum -c -
          printf '%s  %s\n' "$DARK_SHA256" "$dark" | sha256sum -c -

          cp "$light" "$TARGET_DIR/populatedLight.macos-26-xcode-26-6.png"
          cp "$dark" "$TARGET_DIR/populatedDark.macos-26-xcode-26-6.png"

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<EOF
          $TARGET_DIR/populatedDark.macos-26-xcode-26-6.png
          $TARGET_DIR/populatedLight.macos-26-xcode-26-6.png
          EOF
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"

      - name: Commit canonical references
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$TARGET_DIR/populatedLight.macos-26-xcode-26-6.png" \
            "$TARGET_DIR/populatedDark.macos-26-xcode-26-6.png"
          git commit -m 'test: refresh Workspace unavailable snapshots'
          git push origin "HEAD:$GITHUB_REF_NAME"
