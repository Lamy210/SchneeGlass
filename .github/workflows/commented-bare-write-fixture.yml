name: Commented Bare Write Fixture
on:
  push:
    branches:
      - bootstrap/commented-bare-write-fixture
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/classify-commented-bare-raw-write
      - name: Verify bare POSIX raw-write refs
        run: bash Scripts/test-file-safety-write-references.sh
