name: mkostemp GREEN Verification

on:
  push:
    branches:
      - verify/mkostemp-mkostemps-green

permissions:
  contents: read

jobs:
  mkostemp-green:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify temporary-file GREEN fixture
        run: bash Scripts/test-file-safety-temporary-file-references.sh
