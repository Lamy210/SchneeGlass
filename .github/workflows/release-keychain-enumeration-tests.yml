name: Production Release Keychain Safety Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-keychain-enumeration-tests.yml'
      - 'Scripts/verify-xcode-version.sh'
      - 'Scripts/build-notarized-release.sh'
      - 'Scripts/test-build-notarized-release-keychain-enumeration.sh'
      - 'Scripts/test-build-notarized-release-identity-enumeration.sh'

permissions:
  contents: read

jobs:
  keychain-enumeration:
    name: Original Keychain Enumeration Failure
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          bash Scripts/verify-xcode-version.sh 'Xcode 26.6'
          swift --version

      - name: Shell syntax
        run: |
          bash -n Scripts/build-notarized-release.sh
          bash -n Scripts/test-build-notarized-release-keychain-enumeration.sh
          bash -n Scripts/test-build-notarized-release-identity-enumeration.sh

      - name: Keychain enumeration failure fixture
        run: bash Scripts/test-build-notarized-release-keychain-enumeration.sh

      - name: Developer ID identity enumeration failure fixture
        run: bash Scripts/test-build-notarized-release-identity-enumeration.sh
