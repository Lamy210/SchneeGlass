name: Temporary SchneeGlassApp Formatter

on:
  push:
    branches:
      - chore/format-schneeglass-app

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/format-schneeglass-app

      - name: Format SchneeGlassApp
        run: |
          xcrun swift-format format --in-place App/SchneeGlassApp.swift
          xcrun swift-format lint --strict App/SchneeGlassApp.swift

      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- App/SchneeGlassApp.swift; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App/SchneeGlassApp.swift
          git commit -m 'style: format SchneeGlassApp'
          git push origin HEAD:chore/format-schneeglass-app
