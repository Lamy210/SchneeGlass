name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'bootstrap/**'

permissions:
  contents: write

concurrency:
  group: bootstrap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: Canonical / Xcode 26.6 / App Build / Safety Guards
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Public repository guard
        run: bash Scripts/verify-public-repo.sh

      - name: Architecture guard
        run: bash Scripts/verify-architecture.sh

      - name: File safety guard
        run: bash Scripts/verify-file-safety.sh

      - name: Release metadata guard
        run: bash Scripts/verify-release-metadata.sh

      - name: Production release preflight
        run: bash Scripts/verify-production-release-preflight.sh

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: Bootstrap workspace snapshot references
        if: github.event_name == 'pull_request' && github.head_ref == 'test/workspace-visual-snapshots'
        env:
          SCHNEEGLASS_VISUAL_SNAPSHOTS: '1'
          SNAPSHOT_TESTING_RECORD: all
        run: |
          set +e
          swift test \
            --package-path Packages/SchneeGlassKit \
            --filter WorkspaceVisualSnapshotTests
          record_status=$?
          set -e

          snapshot_dir='Packages/SchneeGlassKit/Tests/SchneeGlassVisualSnapshotTests/__Snapshots__/WorkspaceVisualSnapshotTests'
          test -d "$snapshot_dir" || {
            echo "Snapshot bootstrap did not create $snapshot_dir (swift test exit $record_status)." >&2
            exit 1
          }

          git add "$snapshot_dir"
          if git diff --cached --quiet; then
            echo 'Workspace snapshot references are already present.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: record workspace visual snapshots'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Visual snapshot regression
        env:
          SCHNEEGLASS_VISUAL_SNAPSHOTS: '1'
          SNAPSHOT_TESTING_RECORD: never
        run: |
          log="$RUNNER_TEMP/visual-snapshots.log"
          {
            swift test \
              --package-path Packages/SchneeGlassKit \
              --filter DesktopGlassVisualSnapshotTests
            swift test \
              --package-path Packages/SchneeGlassKit \
              --filter DesignSystemComponentVisualSnapshotTests
            swift test \
              --package-path Packages/SchneeGlassKit \
              --filter WorkspaceVisualSnapshotTests
          } 2>&1 | tee "$log"
          grep -F 'SCHNEEGLASS_VISUAL_SNAPSHOT_RESULT' "$log"
          grep -F 'SCHNEEGLASS_DESIGN_SYSTEM_SNAPSHOT_RESULT' "$log"
          grep -F 'SCHNEEGLASS_WORKSPACE_SNAPSHOT_RESULT' "$log"

      - name: AddressSanitizer package tests
        if: github.event_name == 'pull_request'
        run: |
          swift test \
            --package-path Packages/SchneeGlassKit \
            --sanitize=address \
            --scratch-path "$RUNNER_TEMP/SchneeGlassKit-ASan"

      - name: Validate Xcode project
        run: |
          xcodebuild -list -project SchneeGlass.xcodeproj
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -resolvePackageDependencies

      - name: Debug app build
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Release app build
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify app bundle and sandbox baseline
        run: |
          APP="$RUNNER_TEMP/SchneeGlassDerivedData/Build/Products/Release/SchneeGlass.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/SchneeGlass"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'io.github.lamy210.schneeglass'

          plutil -lint App/SchneeGlass.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' App/SchneeGlass.entitlements)" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' App/SchneeGlass.entitlements)" = 'true'
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' App/SchneeGlass.entitlements >/dev/null 2>&1; then
            echo 'Unexpected network client entitlement' >&2
            exit 1
          fi

      - name: Package unsigned CI app artifact
        run: |
          APP="$RUNNER_TEMP/SchneeGlassDerivedData/Build/Products/Release/SchneeGlass.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" SchneeGlass-unsigned-release.zip

      - name: Upload unsigned CI app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchneeGlass-unsigned-macos-ci
          path: SchneeGlass-unsigned-release.zip
          if-no-files-found: error
          retention-days: 7

  compatibility-macos-15:
    name: Compatibility / macOS 15 / App Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: macOS 15 app compatibility build
        run: |
          xcodebuild -list -project SchneeGlass.xcodeproj
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
