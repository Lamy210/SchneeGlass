name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'bootstrap/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: bootstrap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: Canonical / Xcode 26.6 / App Build / Safety Guards
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Public repository guard
        run: bash Scripts/verify-public-repo.sh

      - name: Architecture guard
        run: bash Scripts/verify-architecture.sh

      - name: File safety guard
        run: bash Scripts/verify-file-safety.sh

      - name: Release metadata guard
        run: bash Scripts/verify-release-metadata.sh

      - name: Production release preflight
        run: bash Scripts/verify-production-release-preflight.sh

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: Visual snapshot regression
        id: visual_snapshots
        env:
          SCHNEEGLASS_VISUAL_SNAPSHOTS: '1'
          SNAPSHOT_TESTING_RECORD: never
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/visual-snapshot-artifacts
        run: |
          log="$RUNNER_TEMP/visual-snapshots.log"
          {
            swift test \
              --package-path Packages/SchneeGlassKit \
              --filter DesktopGlassVisualSnapshotTests
            swift test \
              --package-path Packages/SchneeGlassKit \
              --filter DesignSystemComponentVisualSnapshotTests
            swift test \
              --package-path Packages/SchneeGlassKit \
              --filter WorkspaceVisualSnapshotTests
          } 2>&1 | tee "$log"
          bash Scripts/verify-visual-snapshots.sh DesktopGlassVisualSnapshotTests "$log"
          bash Scripts/verify-visual-snapshots.sh DesignSystemComponentVisualSnapshotTests "$log"
          bash Scripts/verify-visual-snapshots.sh WorkspaceVisualSnapshotTests "$log"

      - name: Upload visual snapshot failure diagnostics
        if: ${{ failure() && steps.visual_snapshots.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: SchneeGlass-visual-snapshot-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/visual-snapshot-artifacts
            ${{ runner.temp }}/visual-snapshots.log
            Packages/SchneeGlassKit/Tests/SchneeGlassVisualSnapshotTests/__Snapshots__
          if-no-files-found: error
          retention-days: 3

      - name: Recover PR 114 unavailable snapshot baseline
        if: ${{ failure() && steps.visual_snapshots.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.number == 114 && github.head_ref == 'fix/unavailable-folder-recovery-guidance' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Lamy210' }}
        env:
          TARGET_BRANCH: fix/unavailable-folder-recovery-guidance
          SNAPSHOT_ARTIFACT_ID: '10304384823'
          CAPTURE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pr114-snapshot.zip"
          extract="$RUNNER_TEMP/pr114-snapshot"
          target="Packages/SchneeGlassKit/Tests/SchneeGlassVisualSnapshotTests/__Snapshots__/DesktopGlassVisualSnapshotTests/unavailableLight.macos-26-xcode-26-6.png"

          curl --fail-with-body --location --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $CAPTURE_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SNAPSHOT_ARTIFACT_ID}/zip" \
            --output "$archive"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          actual="$(find "$extract" -type f -path '*/_temp/visual-snapshot-artifacts/DesktopGlassVisualSnapshotTests/unavailableLight.macos-26-xcode-26-6.png' -print -quit)"
          test -n "$actual"
          test -f "$actual"
          file "$actual" | grep -F 'PNG image data'

          git fetch origin "refs/heads/$TARGET_BRANCH"
          git checkout --detach FETCH_HEAD
          cp "$actual" "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then
            echo 'Expected snapshot baseline to change.' >&2
            exit 1
          fi
          git commit -m 'test: capture unavailable snapshot baseline'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: AddressSanitizer package tests
        if: github.event_name == 'pull_request'
        run: |
          swift test \
            --package-path Packages/SchneeGlassKit \
            --sanitize=address \
            --scratch-path "$RUNNER_TEMP/SchneeGlassKit-ASan"

      - name: Validate Xcode project
        run: |
          xcodebuild -list -project SchneeGlass.xcodeproj
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -resolvePackageDependencies

      - name: Debug app build
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Release app build
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify app bundle and sandbox baseline
        run: |
          APP="$RUNNER_TEMP/SchneeGlassDerivedData/Build/Products/Release/SchneeGlass.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/SchneeGlass"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'io.github.lamy210.schneeglass'

          plutil -lint App/SchneeGlass.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' App/SchneeGlass.entitlements)" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' App/SchneeGlass.entitlements)" = 'true'
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' App/SchneeGlass.entitlements >/dev/null 2>&1; then
            echo 'Unexpected network client entitlement' >&2
            exit 1
          fi

      - name: Package unsigned CI app artifact
        run: |
          APP="$RUNNER_TEMP/SchneeGlassDerivedData/Build/Products/Release/SchneeGlass.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" SchneeGlass-unsigned-release.zip

      - name: Upload unsigned CI app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchneeGlass-unsigned-macos-ci
          path: SchneeGlass-unsigned-release.zip
          if-no-files-found: error
          retention-days: 7

  compatibility-macos-15:
    name: Compatibility / macOS 15 / App Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: macOS 15 app compatibility build
        run: |
          xcodebuild -list -project SchneeGlass.xcodeproj
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
