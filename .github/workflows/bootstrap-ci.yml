name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'bootstrap/**'

permissions:
  contents: read

concurrency:
  group: bootstrap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: Canonical / Xcode 26.6 / Safety Guards
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Public repository guard
        run: bash Scripts/verify-public-repo.sh

      - name: Architecture guard
        run: bash Scripts/verify-architecture.sh

      - name: File safety guard
        run: bash Scripts/verify-file-safety.sh

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

  compatibility-macos-15:
    name: Compatibility / macOS 15
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit
