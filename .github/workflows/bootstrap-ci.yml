name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'bootstrap/**'

permissions:
  contents: read

concurrency:
  group: bootstrap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: Canonical / Xcode 26.6 / App Build / Safety Guards
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Swift format lint
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_CREATED: ${{ github.event.created }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          xcrun swift-format --version

          zero_sha='0000000000000000000000000000000000000000'

          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            if [[ -z "${GITHUB_BASE_REF:-}" ]]; then
              echo 'Unable to determine the pull request base branch for swift-format lint.' >&2
              exit 1
            fi

            base_ref="refs/remotes/origin/${GITHUB_BASE_REF}"
            if ! git show-ref --verify --quiet "${base_ref}"; then
              echo "Base branch ${GITHUB_BASE_REF} is not available in the checkout." >&2
              exit 1
            fi

            if ! BASE_SHA="$(git merge-base HEAD "${base_ref}")"; then
              echo "Unable to determine the merge base with ${GITHUB_BASE_REF}." >&2
              exit 1
            fi
          elif [[ "${EVENT_CREATED:-false}" == 'true' || "${EVENT_BEFORE_SHA:-}" == "${zero_sha}" ]]; then
            if [[ -z "${DEFAULT_BRANCH:-}" ]]; then
              echo 'Unable to determine the default branch for a newly created ref.' >&2
              exit 1
            fi

            base_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
            if ! git show-ref --verify --quiet "${base_ref}"; then
              echo "Default branch ${DEFAULT_BRANCH} is not available in the checkout." >&2
              exit 1
            fi

            if ! BASE_SHA="$(git merge-base HEAD "${base_ref}")"; then
              echo "Unable to determine the merge base with ${DEFAULT_BRANCH}." >&2
              exit 1
            fi
          else
            BASE_SHA="${EVENT_BEFORE_SHA:-}"
          fi

          if [[ -z "${BASE_SHA:-}" ]]; then
            echo 'Unable to determine the base commit for swift-format lint.' >&2
            exit 1
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit ${BASE_SHA} is not available in the checkout." >&2
            exit 1
          fi

          CHANGED_SWIFT_FILES="$RUNNER_TEMP/changed-swift-files.bin"
          bash Scripts/collect-changed-swift-files.sh "$BASE_SHA" "$CHANGED_SWIFT_FILES"

          files=()
          file_count=0
          while IFS= read -r -d '' file; do
            files+=("$file")
            ((file_count += 1))
          done < "$CHANGED_SWIFT_FILES"

          if (( file_count == 0 )); then
            echo 'No added, copied, modified, or renamed Swift files to lint.'
            exit 0
          fi

          printf 'Linting %d changed Swift file(s):\n' "$file_count"
          printf '  %s\n' "${files[@]}"

          xcrun swift-format lint \
            --strict \
            --parallel \
            "${files[@]}"

      - name: Swift format changed-file enumeration fixture
        run: bash Scripts/test-swift-format-enumeration.sh

      - name: Public repository guard
        run: bash Scripts/verify-public-repo.sh

      - name: Public repository enumeration failure fixture
        run: bash Scripts/test-public-repo-enumeration.sh

      - name: GitHub Actions pin guard
        run: bash Scripts/verify-github-actions-pins.sh

      - name: GitHub Actions pin enumeration failure fixture
        run: bash Scripts/test-github-actions-pin-enumeration.sh

      - name: Architecture guard
        run: bash Scripts/verify-architecture.sh

      - name: Architecture enumeration failure fixture
        run: bash Scripts/test-architecture-enumeration.sh

      - name: File safety guard
        run: bash Scripts/verify-file-safety.sh

      - name: File safety enumeration failure fixture
        run: bash Scripts/test-file-safety-enumeration.sh

      - name: Release metadata guard
        run: bash Scripts/verify-release-metadata.sh

      - name: App icon guard
        run: bash Scripts/verify-app-icon.sh

      - name: Production release preflight
        run: bash Scripts/verify-production-release-preflight.sh

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: Visual snapshot regression
        id: visual_snapshots
        env:
          SCHNEEGLASS_VISUAL_SNAPSHOTS: '1'
          SNAPSHOT_TESTING_RECORD: never
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/visual-snapshot-artifacts
        run: bash Scripts/run-visual-snapshot-regression.sh "$RUNNER_TEMP/visual-snapshots.log"

      - name: Visual snapshot process-exit fixture
        run: bash Scripts/test-visual-snapshot-exit-status.sh

      - name: Upload visual snapshot failure diagnostics
        if: ${{ failure() && steps.visual_snapshots.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SchneeGlass-visual-snapshot-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/visual-snapshot-artifacts
            ${{ runner.temp }}/visual-snapshots.log
            Packages/SchneeGlassKit/Tests/SchneeGlassVisualSnapshotTests/__Snapshots__
          if-no-files-found: error
          retention-days: 3

      - name: AddressSanitizer package tests
        if: github.event_name == 'pull_request'
        run: |
          swift test \
            --package-path Packages/SchneeGlassKit \
            --sanitize=address \
            --scratch-path "$RUNNER_TEMP/SchneeGlassKit-ASan"

      - name: Validate Xcode project
        run: |
          xcodebuild -list -project SchneeGlass.xcodeproj
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -resolvePackageDependencies

      - name: Debug app build
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Release app build
        run: |
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify app bundle and sandbox baseline
        run: |
          APP="$RUNNER_TEMP/SchneeGlassDerivedData/Build/Products/Release/SchneeGlass.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/SchneeGlass"
          plutil -lint "$APP/Contents/Info.plist"
          bash Scripts/verify-required-plist-value.sh "$APP/Contents/Info.plist" 'CFBundleIdentifier' 'io.github.lamy210.schneeglass' 'Bootstrap bundle verification'

          plutil -lint App/SchneeGlass.entitlements
          bash Scripts/verify-required-plist-value.sh App/SchneeGlass.entitlements 'com.apple.security.app-sandbox' 'true' 'Bootstrap entitlement verification'
          bash Scripts/verify-required-plist-value.sh App/SchneeGlass.entitlements 'com.apple.security.files.user-selected.read-write' 'true' 'Bootstrap entitlement verification'
          bash Scripts/verify-optional-release-entitlements.sh App/SchneeGlass.entitlements 'Bootstrap entitlement verification'

      - name: Package unsigned CI app artifact
        run: |
          APP="$RUNNER_TEMP/SchneeGlassDerivedData/Build/Products/Release/SchneeGlass.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" SchneeGlass-unsigned-release.zip

      - name: Upload unsigned CI app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SchneeGlass-unsigned-macos-ci
          path: SchneeGlass-unsigned-release.zip
          if-no-files-found: error
          retention-days: 7

  compatibility-macos-15:
    name: Compatibility / macOS 15 / App Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift package tests
        run: swift test --package-path Packages/SchneeGlassKit

      - name: macOS 15 app compatibility build
        run: |
          xcodebuild -list -project SchneeGlass.xcodeproj
          xcodebuild \
            -project SchneeGlass.xcodeproj \
            -scheme SchneeGlass \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SchneeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
