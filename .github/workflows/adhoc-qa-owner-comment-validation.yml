name: Ad-Hoc Owner QA Comment Validation

on:
  pull_request:
    paths:
      - '.github/workflows/adhoc-qa-owner-comment-validation.yml'
      - 'Scripts/verify-adhoc-qa-comment-from-github.sh'
      - 'Scripts/test-verify-adhoc-qa-comment-from-github.sh'

permissions:
  contents: read

jobs:
  fixture:
    name: Ad-Hoc Owner QA Comment / Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell syntax
        run: |
          bash -n Scripts/verify-adhoc-qa-comment-from-github.sh
          bash -n Scripts/test-verify-adhoc-qa-comment-from-github.sh

      - name: Authenticated owner approval identity and candidate-binding fixtures
        run: bash Scripts/test-verify-adhoc-qa-comment-from-github.sh
