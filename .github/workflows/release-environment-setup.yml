name: Release Environment Setup Tests

on:
  pull_request:
    paths:
      - '.github/workflows/release-environment-setup.yml'
      - 'Scripts/setup-production-release-environment.sh'
      - 'Scripts/verify-local-release-source.sh'
      - 'Scripts/test-verify-local-release-source.sh'
      - 'Scripts/test-setup-production-release-environment.sh'
      - 'Scripts/test-setup-production-release-environment-existing.sh'
      - 'Scripts/test-production-release-environment-credential-names.sh'
      - 'Scripts/test-release-environment-path-coverage.sh'
      - 'Scripts/verify-release-branch-protection.sh'
      - 'Scripts/verify-release-required-branch-rules.sh'
      - 'Scripts/verify-release-required-checks.sh'
      - 'docs/RELEASE_CREDENTIALS.md'

permissions:
  contents: read

jobs:
  fixture:
    name: Release Environment Setup / Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell syntax
        run: |
          bash -n Scripts/setup-production-release-environment.sh
          bash -n Scripts/verify-local-release-source.sh
          bash -n Scripts/test-verify-local-release-source.sh
          bash -n Scripts/test-setup-production-release-environment.sh
          bash -n Scripts/test-setup-production-release-environment-existing.sh
          bash -n Scripts/test-production-release-environment-credential-names.sh
          bash -n Scripts/test-release-environment-path-coverage.sh

      - name: Release Environment path coverage fixture
        run: bash Scripts/test-release-environment-path-coverage.sh

      - name: Local release source fixture
        run: bash Scripts/test-verify-local-release-source.sh

      - name: Governance and creation fixtures
        run: bash Scripts/test-setup-production-release-environment.sh

      - name: Existing Environment fixtures
        run: bash Scripts/test-setup-production-release-environment-existing.sh

      - name: Credential-name fixtures
        run: bash Scripts/test-production-release-environment-credential-names.sh
